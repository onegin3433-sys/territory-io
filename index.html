<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>Territory IO — Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d1523;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;justify-content:center;padding:8px}.app{width:min(100%,760px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 9px}h1{font-size:clamp(17px,4vw,23px);margin:0}
.stats{display:flex;gap:5px}.pill{background:#1b2a40;border:1px solid #344761;border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap}
.stage{position:relative;background:#111d30;border:1px solid #344761;border-radius:16px;padding:6px;box-shadow:0 12px 36px #0007}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:12px;touch-action:none}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:10px 2px 0;flex-wrap:wrap}.hint{font-size:12px;color:#aebed2;line-height:1.35;flex:1;min-width:190px}
button{border:0;border-radius:11px;padding:10px 14px;background:#32cf8b;color:#062116;font-weight:800;font-size:14px}
#message{text-align:center;color:#b7c8dc;font-size:12px;min-height:18px;margin:8px 0 2px}
@media(max-width:430px){body{padding:5px}.stage{padding:4px;border-radius:13px}.pill{padding:5px 7px;font-size:11px}}
</style>
</head>
<body><main class="app">
<header><h1>🟢 TERRITORY IO</h1><div class="stats"><div class="pill">Территория <b id="score">0%</b></div><div class="pill">Рекорд <b id="best">0%</b></div></div></header>
<div class="stage">
<canvas id="game" width="960" height="960" aria-label="Круглая игровая арена"></canvas>

</div>
<div class="bottom"><div class="hint">Проводи пальцем в нужную сторону в любой части арены — персонаж повернёт туда. Выйди из своей зоны, нарисуй петлю и вернись.</div><button id="restart">Заново</button></div>
<div id="message">Захватывай территорию и остерегайся открытого следа.</div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=960,C=240,S=W/C,CX=W/2,CY=W/2,R=458,EMPTY=0,OUT=255;
const COLORS={1:'#2ed28f',2:'#ff5874',3:'#ffc04d',4:'#a78bfa'};
const names={1:'Ты',2:'Красный',3:'Жёлтый',4:'Фиолетовый'};
const mapCanvas=document.createElement('canvas');mapCanvas.width=C;mapCanvas.height=C;
const mctx=mapCanvas.getContext('2d',{willReadFrequently:true});
let land,players,player,frame=0,best=Number(localStorage.getItem('territoryBest')||0),touchActive=false,touchPointer=null,touchLast=null,keys={};
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('message');
bestEl.textContent=best+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function valid(x,y){return x>=0&&y>=0&&x<C&&y<C&&Math.hypot((x+.5)*S-CX,(y+.5)*S-CY)<=R;}
function cellAt(x,y){const gx=Math.floor(x/S),gy=Math.floor(y/S);return gx>=0&&gy>=0&&gx<C&&gy<C?gy*C+gx:-1;}
function ownerAt(x,y){const i=cellAt(x,y);return i<0?OUT:land[i];}
function setCell(x,y,id){if(x>=0&&y>=0&&x<C&&y<C&&valid(x,y))land[y*C+x]=id;}
function stamp(id,points,radius=2.8){
 const rr=Math.ceil(radius);
 for(const p of points){const gx=Math.floor(p.x/S),gy=Math.floor(p.y/S);
  for(let oy=-rr;oy<=rr;oy++)for(let ox=-rr;ox<=rr;ox++)if(ox*ox+oy*oy<=radius*radius)setCell(gx+ox,gy+oy,id);
 }
}
function seedBase(id,x,y,r){
 const pts=[];for(let a=0;a<Math.PI*2;a+=.055)pts.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r});
 for(let yy=Math.floor((y-r)/S);yy<=Math.ceil((y+r)/S);yy++)for(let xx=Math.floor((x-r)/S);xx<=Math.ceil((x+r)/S);xx++){
  if(Math.hypot((xx+.5)*S-x,(yy+.5)*S-y)<=r)setCell(xx,yy,id);
 }
}
function countOwned(id){let n=0;for(let i=0;i<land.length;i++)if(land[i]===id)n++;return n;}
function updateScore(){
 const validCount=land.reduce((n,v)=>n+(v!==OUT),0),mine=countOwned(1),pct=Math.round(mine/validCount*100);
 scoreEl.textContent=pct+'%';if(pct>best){best=pct;bestEl.textContent=best+'%';localStorage.setItem('territoryBest',best);}
}
function nearestLand(id,x,y){
 let bestPoint=null,bestD=Infinity;
 const gx=Math.floor(x/S),gy=Math.floor(y/S),max=70;
 for(let rad=0;rad<=max;rad+=3){
  for(let yy=Math.max(0,gy-rad);yy<=Math.min(C-1,gy+rad);yy+=Math.max(1,Math.floor(rad/8))){
   for(let xx=Math.max(0,gx-rad);xx<=Math.min(C-1,gx+rad);xx+=Math.max(1,Math.floor(rad/8))){
    if(land[yy*C+xx]===id){const px=(xx+.5)*S,py=(yy+.5)*S,d=(px-x)**2+(py-y)**2;if(d<bestD){bestD=d;bestPoint={x:px,y:py};}}
   }
  }
  if(bestPoint&&bestD<(rad*S+S)**2)break;
 }
 return bestPoint;
}
function capture(id,path){
 stamp(id,path,2.7);
 // Flood the cells connected to the circular arena's outside through non-owned land.
 const seen=new Uint8Array(C*C),queue=new Int32Array(C*C);let head=0,tail=0;
 for(let y=0;y<C;y++)for(let x=0;x<C;x++){
  const i=y*C+x;if(land[i]===OUT)continue;
  let edge=false;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(!valid(x+dx,y+dy)){edge=true;break;}
  if(edge&&land[i]!==id&&!seen[i]){seen[i]=1;queue[tail++]=i;}
 }
 while(head<tail){
  const i=queue[head++],x=i%C,y=(i/C)|0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=C||ny>=C)continue;
   const ni=ny*C+nx;if(!seen[ni]&&land[ni]!==OUT&&land[ni]!==id){seen[ni]=1;queue[tail++]=ni;}
  }
 }
 for(let i=0;i<land.length;i++)if(land[i]!==OUT&&land[i]!==id&&!seen[i])land[i]=id;
 updateScore();
}
function makePlayer(id,x,y,angle,isHuman=false){
 return{id,x,y,angle,speed:isHuman?170:125,trail:[],outside:false,turn:0,think:0,targetAngle:angle,isHuman,alive:true};
}
function reset(){
 land=new Uint8Array(C*C);land.fill(OUT);
 for(let y=0;y<C;y++)for(let x=0;x<C;x++)if(valid(x,y))land[y*C+x]=EMPTY;
 seedBase(1,390,480,68);
 seedBase(2,690,285,57);seedBase(3,690,680,57);seedBase(4,270,700,57);
 player=makePlayer(1,455,480,0,true);
 players=[player,makePlayer(2,690,285,2.5),makePlayer(3,690,680,-2),makePlayer(4,270,700,-.2)];
 frame=0;updateScore();msg.textContent='Боты уже на арене. Захвати как можно больше пространства.';draw();
}
function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a));}
function steer(p,dt){
 if(p.isHuman){
  if(!touchActive){
   let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
   if(dx||dy)p.targetAngle=Math.atan2(dy,dx);
  }
 }else{
  p.think-=dt;
  if(p.trail.length>22|| (p.outside&&p.trail.length>12&&p.think<=0&&Math.random()<.018)){
   const home=nearestLand(p.id,p.x,p.y);if(home)p.targetAngle=Math.atan2(home.y-p.y,home.x-p.x);
  }else if(p.think<=0){
   p.targetAngle+=((Math.random()-.5)*1.8);p.think=.45+Math.random()*.8;
  }
 }
 const diff=angleDiff(p.angle,p.targetAngle),turnRate=p.isHuman?4.2:1.9;
 p.angle+=clamp(diff,-turnRate*dt,turnRate*dt);
}
function sampleSegment(a,b,spacing=3){
 const d=dist(a,b),n=Math.max(1,Math.ceil(d/spacing)),out=[];
 for(let i=1;i<=n;i++){const t=i/n;out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}
 return out;
}
function kill(p,reason){
 if(!p.alive)return;
 p.trail=[];p.outside=false;
 const home=nearestLand(p.id,p.x,p.y);
 if(home){p.x=home.x;p.y=home.y;}else{const fallback={1:[390,480],2:[690,285],3:[690,680],4:[270,700]}[p.id];p.x=fallback[0];p.y=fallback[1];}
 p.targetAngle=p.angle;p.think=1;
 if(p.isHuman)msg.textContent=reason||'Твой след пересекли! Попробуй снова.';
}
function checkTrailHit(mover,from,to){
 for(const other of players){if(other===mover||!other.trail.length)continue;
  for(let i=0;i<other.trail.length;i+=2)if(dist(to,other.trail[i])<10){kill(other,other.isHuman?'Твой след пересекли!':'');return true;}
 }
 return false;
}
function moveOne(p,dt){
 steer(p,dt);
 const from={x:p.x,y:p.y},to={x:p.x+Math.cos(p.angle)*p.speed*dt,y:p.y+Math.sin(p.angle)*p.speed*dt};
 const radial=Math.hypot(to.x-CX,to.y-CY);
 if(radial>R-9){
  // Reflect the movement vector off the circular arena wall.
  const nx=(to.x-CX)/radial,ny=(to.y-CY)/radial;
  const vx=Math.cos(p.angle),vy=Math.sin(p.angle),dot=vx*nx+vy*ny;
  p.x=CX+nx*(R-9);p.y=CY+ny*(R-9);
  p.angle=Math.atan2(vy-2*dot*ny,vx-2*dot*nx);
  p.targetAngle=p.angle;
  return;
 }
 for(const other of players)if(other!==p&&dist(to,other)<13){if(other.trail.length)kill(other,other.isHuman?'Твой след пересекли!':'');}
 if(checkTrailHit(p,from,to))return;
 p.x=to.x;p.y=to.y;
 const own=ownerAt(p.x,p.y)===p.id;
 if(!own){
  p.outside=true;
  const samples=sampleSegment(from,to,2.4);
  p.trail.push(...samples);
  if(p.trail.length>500){kill(p,p.isHuman?'Слишком длинный след — вернись на свою территорию!':'');return;}
 }else if(p.outside&&p.trail.length){
  const closing=sampleSegment(from,to,2.4);p.trail.push(...closing);
  capture(p.id,p.trail);p.trail=[];p.outside=false;
  if(p.isHuman)msg.textContent='Отлично! Территория захвачена.';
 }
}
function draw(){
 ctx.clearRect(0,0,W,W);ctx.fillStyle='#0b1422';ctx.fillRect(0,0,W,W);
 ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle='#142238';ctx.fill();ctx.clip();
 const img=mctx.createImageData(C,C),d=img.data;
 for(let i=0;i<land.length;i++){const id=land[i],col=id===OUT?[12,20,34]:id===EMPTY?[23,39,60]:hex(COLORS[id]);const k=i*4;d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=255;}
 mctx.putImageData(img,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(mapCanvas,0,0,W,W);ctx.imageSmoothingEnabled=true;
 // subtle circular arena grid
 ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;
 for(let r=70;r<R;r+=70){ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke();}
 for(const p of players){
  if(p.trail.length>1){ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);for(let i=1;i<p.trail.length;i++)ctx.lineTo(p.trail[i].x,p.trail[i].y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=COLORS[p.id];ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
 }
 for(const p of players){
  ctx.beginPath();ctx.arc(p.x,p.y,p.isHuman?11:10,0,Math.PI*2);ctx.fillStyle=COLORS[p.id];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#f4f7ff';ctx.stroke();
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(p.angle)*17,p.y+Math.sin(p.angle)*17);ctx.strokeStyle='#102033';ctx.lineWidth=3;ctx.stroke();
 }
 ctx.restore();ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.strokeStyle='#8da5c4';ctx.lineWidth=5;ctx.stroke();
}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
let last=0;
function loop(now){const dt=Math.min((now-last)/1000||0,0.035);last=now;
 for(const p of players)moveOne(p,dt);
 if(frame++%8===0)draw();requestAnimationFrame(loop);
}
function steerByFingerMovement(e){
 const rect=canvas.getBoundingClientRect();
 const x=e.clientX-rect.left,y=e.clientY-rect.top;
 if(touchLast){
  const dx=x-touchLast.x,dy=y-touchLast.y;
  // Direction comes from the finger's movement, not its position on the arena.
  if(Math.hypot(dx,dy)>2.5)player.targetAngle=Math.atan2(dy,dx);
 }
 touchLast={x,y};
}
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 touchActive=true;touchPointer=e.pointerId;
 const rect=canvas.getBoundingClientRect();
 touchLast={x:e.clientX-rect.left,y:e.clientY-rect.top};
 canvas.setPointerCapture(e.pointerId);e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
 if(touchActive&&e.pointerId===touchPointer){steerByFingerMovement(e);e.preventDefault();}
});
function endTouch(e){if(e.pointerId!==touchPointer)return;touchActive=false;touchPointer=null;touchLast=null;}
canvas.addEventListener('pointerup',endTouch);
canvas.addEventListener('pointercancel',endTouch);
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys[e.key]=true;e.preventDefault();}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
document.getElementById('restart').addEventListener('click',reset);
reset();requestAnimationFrame(loop);
})();
</script>
</body></html>
