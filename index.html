<script>
(()=>{
'use strict';
const telegramApp=window.Telegram&&window.Telegram.WebApp;
if(telegramApp){
 telegramApp.ready();
 telegramApp.expand();
 if(typeof telegramApp.setHeaderColor==='function')telegramApp.setHeaderColor('#0b1422');
 if(typeof telegramApp.setBackgroundColor==='function')telegramApp.setBackgroundColor('#0b1422');
 if(typeof telegramApp.disableVerticalSwipes==='function')telegramApp.disableVerticalSwipes();
}

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap'),miniCtx=mini.getContext('2d');
let VIEW_W=960,VIEW_H=960,cameraX=0,cameraY=0,cameraReady=false,terrainDirty=true;
function resizeView(){const h=window.innerHeight;VIEW_H=960;VIEW_W=Math.max(320,Math.round(window.innerWidth/h*VIEW_H));canvas.width=VIEW_W;canvas.height=VIEW_H;}
window.addEventListener('resize',resizeView);resizeView();
const SCALE=3,W=960*SCALE,C=240,S=W/C,CX=W/2,CY=W/2,R=458*SCALE,EMPTY=0,OUT=255;
const COLORS={1:localStorage.getItem('territoryPlayerColor')||'#2ed28f',2:'#ff5874',3:'#ffc04d',4:'#a78bfa'};
let selectedSkin=localStorage.getItem('territorySkin')||'explorer',gameStarted=false;
const names={1:'Ты',2:'Красный',3:'Жёлтый',4:'Фиолетовый'};
const mapCanvas=document.createElement('canvas');mapCanvas.width=C;mapCanvas.height=C;
const mctx=mapCanvas.getContext('2d',{willReadFrequently:true});
const terrainCanvas=document.createElement('canvas');terrainCanvas.width=W;terrainCanvas.height=W;
const tctx=terrainCanvas.getContext('2d');
let land,players,player,frame=0,initialTerrain=true,best=Number(localStorage.getItem('territoryBest')||0),touchActive=false,touchPointer=null,touchLast=null,keys={};
const remotePlayers=new Map();let onlineSocket=null,onlinePlayerId=null,onlineCount=1,lastNetSend=0,onlineRetryTimer=null;
const onlineStatusEl=document.getElementById('onlineStatus');
function setOnlineStatus(text){if(onlineStatusEl)onlineStatusEl.textContent=text;}
function connectOnline(){
 if(onlineRetryTimer){clearTimeout(onlineRetryTimer);onlineRetryTimer=null;}
 try{
  const socket=new WebSocket('wss://territory-wars-server.onegin343.workers.dev/ws');
  onlineSocket=socket;setOnlineStatus('подключение…');
  socket.addEventListener('open',()=>setOnlineStatus('в сети'));
  socket.addEventListener('message',event=>{
   let packet;try{packet=JSON.parse(event.data);}catch{return;}
   if(packet.type==='welcome'){onlinePlayerId=packet.playerId;onlineCount=packet.players||1;setOnlineStatus(String(onlineCount));}
   else if(packet.type==='players'){onlineCount=packet.count||1;setOnlineStatus(String(onlineCount));}
   else if(packet.type==='player_state'&&packet.playerId!==onlinePlayerId){
    remotePlayers.set(String(packet.playerId),{x:packet.x,y:packet.y,angle:packet.angle,trail:Array.isArray(packet.trail)?packet.trail:[],seen:performance.now()});
   }
  });
  socket.addEventListener('close',()=>{if(onlineSocket===socket){onlineSocket=null;onlinePlayerId=null;setOnlineStatus('нет связи');onlineRetryTimer=setTimeout(connectOnline,3000);}});
  socket.addEventListener('error',()=>setOnlineStatus('ошибка связи'));
 }catch{setOnlineStatus('нет связи');onlineRetryTimer=setTimeout(connectOnline,5000);}
}
function sendOnlineState(now){
 if(!onlineSocket||onlineSocket.readyState!==WebSocket.OPEN||!player||now-lastNetSend<100)return;
 lastNetSend=now;
 try{onlineSocket.send(JSON.stringify({type:'state',x:player.x,y:player.y,angle:player.angle,trail:player.trail.slice(-120)}));}catch{}
}
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('message');
bestEl.textContent=best+'%';
let audioContext=null,soundEnabled=localStorage.getItem('territorySound')!=='off';
const soundButton=document.getElementById('soundToggle');
function updateSoundButton(){if(soundButton)soundButton.textContent=soundEnabled?'🔊 Звук':'🔇 Без звука';}
function unlockAudio(){
 try{
  if(!audioContext){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return Promise.resolve(false);audioContext=new AudioCtx();}
  // Call resume immediately inside the user's tap gesture (important in Android/Telegram WebView).
  const resumed=audioContext.state==='running'?Promise.resolve():audioContext.resume();
  return resumed.then(()=>audioContext.state==='running').catch(error=>{console.warn('Audio unavailable',error);return false;});
 }catch(error){console.warn('Audio unavailable',error);return Promise.resolve(false);}
}
function tone(freq,duration,shape='sine',volume=.07,slide=0,delay=0){
 if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
 try{
  const t=audioContext.currentTime+delay,osc=audioContext.createOscillator(),gain=audioContext.createGain();
  osc.type=shape;osc.frequency.setValueAtTime(freq,t);
  if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),t+duration);
  gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(volume,t+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  osc.connect(gain);gain.connect(audioContext.destination);osc.start(t);osc.stop(t+duration+.025);
 }catch(error){console.warn('Sound playback failed',error);}
}
async function playSound(kind){
 if(!soundEnabled)return;
 if(!audioContext||audioContext.state!=='running'){const ready=await unlockAudio();if(!ready)return;}
 if(!soundEnabled)return;
 if(kind==='capture'){tone(520,.16,'sine',.075,210);tone(780,.22,'triangle',.055,180,.07);tone(1040,.26,'sine',.035,120,.14);}
 else if(kind==='eliminate'){tone(660,.12,'triangle',.065,-180);tone(880,.18,'sine',.055,220,.09);tone(1180,.25,'sine',.04,160,.18);}
 else if(kind==='hit'){tone(240,.2,'triangle',.08,-130);tone(115,.28,'sine',.07,-55,.08);}
 else if(kind==='click'){tone(620,.07,'sine',.035,100);}
 else if(kind==='start'){tone(392,.12,'sine',.05,70);tone(523,.16,'sine',.05,100,.1);tone(784,.2,'triangle',.045,120,.2);}
}
updateSoundButton();
// Разблокируем Web Audio при первом реальном касании/нажатии пользователя.
document.addEventListener('pointerdown',()=>{if(!audioContext||audioContext.state!=='running')unlockAudio();},{once:true,capture:true});
soundButton?.addEventListener('click',async()=>{
 soundEnabled=!soundEnabled;localStorage.setItem('territorySound',soundEnabled?'on':'off');updateSoundButton();
 if(soundEnabled)await playSound('start');
});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function valid(x,y){return x>=0&&y>=0&&x<C&&y<C&&Math.hypot((x+.5)*S-CX,(y+.5)*S-CY)<=R;}
function cellAt(x,y){const gx=Math.floor(x/S),gy=Math.floor(y/S);return gx>=0&&gy>=0&&gx<C&&gy<C?gy*C+gx:-1;}
function ownerAt(x,y){const i=cellAt(x,y);return i<0?OUT:land[i];}
function setCell(x,y,id){if(x>=0&&y>=0&&x<C&&y<C&&valid(x,y))land[y*C+x]=id;}
function stamp(id,points,radius=2.8){
 const rr=Math.ceil(radius);
 for(const p of points){const gx=Math.floor(p.x/S),gy=Math.floor(p.y/S);
  for(let oy=-rr;oy<=rr;oy++)for(let ox=-rr;ox<=rr;ox++)if(ox*ox+oy*oy<=radius*radius)setCell(gx+ox,gy+oy,id);
 }
}
function seedBase(id,x,y,r){
 const pts=[];for(let a=0;a<Math.PI*2;a+=.055)pts.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r});
 for(let yy=Math.floor((y-r)/S);yy<=Math.ceil((y+r)/S);yy++)for(let xx=Math.floor((x-r)/S);xx<=Math.ceil((x+r)/S);xx++){
  if(Math.hypot((xx+.5)*S-x,(yy+.5)*S-y)<=r)setCell(xx,yy,id);
 }
}
function countOwned(id){let n=0;for(let i=0;i<land.length;i++)if(land[i]===id)n++;return n;}
function updateScore(){
 const validCount=land.reduce((n,v)=>n+(v!==OUT),0),mine=countOwned(1),pct=Math.round(mine/validCount*100);
 scoreEl.textContent=pct+'%';if(pct>best){best=pct;bestEl.textContent=best+'%';localStorage.setItem('territoryBest',best);}
}
function nearestLand(id,x,y){
 let bestPoint=null,bestD=Infinity;
 const gx=Math.floor(x/S),gy=Math.floor(y/S),max=70;
 for(let rad=0;rad<=max;rad+=3){
  for(let yy=Math.max(0,gy-rad);yy<=Math.min(C-1,gy+rad);yy+=Math.max(1,Math.floor(rad/8))){
   for(let xx=Math.max(0,gx-rad);xx<=Math.min(C-1,gx+rad);xx+=Math.max(1,Math.floor(rad/8))){
    if(land[yy*C+xx]===id){const px=(xx+.5)*S,py=(yy+.5)*S,d=(px-x)**2+(py-y)**2;if(d<bestD){bestD=d;bestPoint={x:px,y:py};}}
   }
  }
  if(bestPoint&&bestD<(rad*S+S)**2)break;
 }
 return bestPoint;
}
function capture(id,path){
 initialTerrain=false;
 stamp(id,path,2.7);
 // Flood the cells connected to the circular arena's outside through non-owned land.
 const seen=new Uint8Array(C*C),queue=new Int32Array(C*C);let head=0,tail=0;
 for(let y=0;y<C;y++)for(let x=0;x<C;x++){
  const i=y*C+x;if(land[i]===OUT)continue;
  let edge=false;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(!valid(x+dx,y+dy)){edge=true;break;}
  if(edge&&land[i]!==id&&!seen[i]){seen[i]=1;queue[tail++]=i;}
 }
 while(head<tail){
  const i=queue[head++],x=i%C,y=(i/C)|0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=C||ny>=C)continue;
   const ni=ny*C+nx;if(!seen[ni]&&land[ni]!==OUT&&land[ni]!==id){seen[ni]=1;queue[tail++]=ni;}
  }
 }
 for(let i=0;i<land.length;i++)if(land[i]!==OUT&&land[i]!==id&&!seen[i])land[i]=id;
 updateScore();terrainDirty=true;playSound('capture');
}
function makePlayer(id,x,y,angle,isHuman=false){
 return{id,x,y,angle,speed:(isHuman?130:95)*SCALE,trail:[],outside:false,turn:0,think:.25+Math.random()*.5,targetAngle:angle,isHuman,alive:true,homeTarget:null};
}
function reset(){
 land=new Uint8Array(C*C);land.fill(OUT);
 for(let y=0;y<C;y++)for(let x=0;x<C;x++)if(valid(x,y))land[y*C+x]=EMPTY;
 seedBase(1,390*SCALE,480*SCALE,68*SCALE);
 seedBase(2,690*SCALE,285*SCALE,57*SCALE);seedBase(3,690*SCALE,680*SCALE,57*SCALE);seedBase(4,270*SCALE,700*SCALE,57*SCALE);
 player=makePlayer(1,455*SCALE,480*SCALE,0,true);
 players=[player,makePlayer(2,690*SCALE,285*SCALE,2.5),makePlayer(3,690*SCALE,680*SCALE,-2),makePlayer(4,270*SCALE,700*SCALE,-.2)];
 frame=0;initialTerrain=true;cameraX=player.x-VIEW_W/2;cameraY=player.y-VIEW_H/2;cameraReady=true;terrainDirty=true;updateScore();msg.textContent='Поле увеличено в 3 раза. Камера плавно следует за тобой.';draw();
}
function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a));}
function steer(p,dt){
 if(p.isHuman){
  if(!touchActive){
   let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
   if(dx||dy)p.targetAngle=Math.atan2(dy,dx);
  }
 }else{
  // Think in short intervals instead of searching the whole nearby map every frame.
  p.think-=dt;
  if(p.think<=0){
   if(p.outside||p.trail.length>18){
    p.homeTarget=nearestLand(p.id,p.x,p.y);
    if(p.homeTarget)p.targetAngle=Math.atan2(p.homeTarget.y-p.y,p.homeTarget.x-p.x);
    p.think=.28;
   }else{
    p.targetAngle+=((Math.random()-.5)*1.25);
    p.think=.65+Math.random()*.55;
   }
  }else if(p.outside&&p.homeTarget&&p.trail.length>18){
   const d=Math.atan2(p.homeTarget.y-p.y,p.homeTarget.x-p.x);
   p.targetAngle+=clamp(angleDiff(p.targetAngle,d),-dt*1.2,dt*1.2);
  }
 }
 const diff=angleDiff(p.angle,p.targetAngle),turnRate=p.isHuman?4.2:1.9;
 p.angle+=clamp(diff,-turnRate*dt,turnRate*dt);
}
function sampleSegment(a,b,spacing=3){
 const d=dist(a,b),n=Math.max(1,Math.ceil(d/spacing)),out=[];
 for(let i=1;i<=n;i++){const t=i/n;out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}
 return out;
}
function nearestOwnedCell(id,x,y){
 let best=-1,bestD=Infinity;
 const gx=Math.floor(x/S),gy=Math.floor(y/S);
 for(let r=0;r<=C;r+=4){
  const x0=Math.max(0,gx-r),x1=Math.min(C-1,gx+r),y0=Math.max(0,gy-r),y1=Math.min(C-1,gy+r);
  for(let xx=x0;xx<=x1;xx++)for(const yy of [y0,y1]){
   const i=yy*C+xx;if(land[i]!==id)continue;
   const d=(xx+.5-gx)**2+(yy+.5-gy)**2;if(d<bestD){bestD=d;best=i;}
  }
  for(let yy=y0+1;yy<y1;yy++)for(const xx of [x0,x1]){
   const i=yy*C+xx;if(land[i]!==id)continue;
   const d=(xx+.5-gx)**2+(yy+.5-gy)**2;if(d<bestD){bestD=d;best=i;}
  }
  if(best>=0&&bestD<=(r+2)*(r+2))break;
 }
 return best;
}
function keepSingleTerritory(id,seed){
 if(seed<0||land[seed]!==id)return;
 const seen=new Uint8Array(C*C),queue=new Int32Array(C*C);let head=0,tail=0;
 seen[seed]=1;queue[tail++]=seed;
 while(head<tail){
  const i=queue[head++],x=i%C,y=(i/C)|0;
  for(const ni of [x>0?i-1:-1,x<C-1?i+1:-1,y>0?i-C:-1,y<C-1?i+C:-1]){
   if(ni>=0&&!seen[ni]&&land[ni]===id){seen[ni]=1;queue[tail++]=ni;}
  }
 }
 // A player owns only the connected landmass attached to their original base.
 for(let i=0;i<land.length;i++)if(land[i]===id&&!seen[i])land[i]=EMPTY;
}
function kill(p,reason,killer=null){
 if(!p.alive)return;
 playSound(killer?'eliminate':'hit');
 const defeatedTrail=p.trail.slice();
 p.alive=false;
 p.trail=[];p.outside=false;p.homeTarget=null;
 if(killer&&killer.alive&&killer!==p){
  for(let i=0;i<land.length;i++)if(land[i]===p.id)land[i]=killer.id;

  if(id===1){for(let k=-64;k<128;k+=18){p.beginPath();p.moveTo(k,0);p.lineTo(k+64,64);p.stroke();}}
  else if(id===2){for(let y=10;y<64;y+=22)for(let x=10;x<64;x+=22){p.beginPath();p.arc(x,y,4,0,Math.PI*2);p.fill();}}
  else if(id===3){for(let y=-64;y<128;y+=24)for(let x=-64;x<128;x+=24){p.beginPath();p.moveTo(x,y-7);p.lineTo(x+7,y);p.lineTo(x,y+7);p.lineTo(x-7,y);p.closePath();p.fill();}}
  else {for(let y=0;y<=64;y+=20){p.beginPath();p.moveTo(0,y);p.lineTo(64,y);p.stroke();}for(let x=0;x<=64;x+=20){p.beginPath();p.moveTo(x,0);p.lineTo(x,64);p.stroke();}}
  patternTiles[id]=tile;
 }
 return target.createPattern(tile,'repeat');
}
let last=0,performanceNowDelta=16.67;
function loop(now){
 const dt=Math.min((now-last)/1000||0,0.035);
 performanceNowDelta=now-last||16.67;last=now;frame+=dt*60;
 if(gameStarted){for(const p of players)moveOne(p,dt);sendOnlineState(now);}
 for(const [id,p] of remotePlayers){if(now-p.seen>10000)remotePlayers.delete(id);}
 if(gameStarted)draw();requestAnimationFrame(loop);
}
function steerByFingerMovement(e){
 const rect=canvas.getBoundingClientRect();
 const x=e.clientX-rect.left,y=e.clientY-rect.top;
 if(touchLast){
  const dx=x-touchLast.x,dy=y-touchLast.y;
  // Direction comes from the finger's movement, not its position on the arena.
  if(Math.hypot(dx,dy)>2.5)player.targetAngle=Math.atan2(dy,dx);
 }
 touchLast={x,y};
}
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 touchActive=true;touchPointer=e.pointerId;
 const rect=canvas.getBoundingClientRect();
 touchLast={x:e.clientX-rect.left,y:e.clientY-rect.top};
 canvas.setPointerCapture(e.pointerId);e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
 if(touchActive&&e.pointerId===touchPointer){steerByFingerMovement(e);e.preventDefault();}
});
function endTouch(e){if(e.pointerId!==touchPointer)return;touchActive=false;touchPointer=null;touchLast=null;}
canvas.addEventListener('pointerup',endTouch);
canvas.addEventListener('pointercancel',endTouch);
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys[e.key]=true;e.preventDefault();}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

document.getElementById('restart').addEventListener('click',()=>{playSound('click');reset();});
const menu=document.getElementById('mainMenu');
document.querySelectorAll('.skin-choice').forEach(button=>{
 if(button.dataset.skin===selectedSkin)button.classList.add('selected');
 button.addEventListener('click',()=>{
  selectedSkin=button.dataset.skin;localStorage.setItem('territorySkin',selectedSkin);playSound('click');
  document.querySelectorAll('.skin-choice').forEach(b=>b.classList.toggle('selected',b===button));
 });
});
document.querySelectorAll('.color-choice').forEach(button=>{
 if(button.dataset.color===COLORS[1])button.classList.add('selected');
 button.addEventListener('click',()=>{
  COLORS[1]=button.dataset.color;localStorage.setItem('territoryPlayerColor',COLORS[1]);playSound('click');
  document.querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('selected',b===button));
 });
});
document.getElementById('playButton').addEventListener('click',()=>{
 unlockAudio().then(ready=>{if(ready&&soundEnabled)playSound('start');});
 gameStarted=true;menu.style.display='none';
 document.querySelector('.hud').style.display='flex';
 document.querySelector('.brand').style.display='flex';
 document.getElementById('minimap').style.display='block';
 reset();
});
connectOnline();requestAnimationFrame(loop);
})();
