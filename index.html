<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>Territory IO — Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1422;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{position:fixed;inset:0;width:100%;height:100dvh}
#game{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;z-index:2;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.stats{display:flex;gap:5px}.pill{background:#142238dd;border:1px solid #536985;border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;backdrop-filter:blur(5px)}
button{pointer-events:auto;border:1px solid #536985;border-radius:10px;padding:8px 11px;background:#142238dd;color:#eef4ff;font-weight:700;font-size:12px}
#message{position:absolute;z-index:2;bottom:max(8px,env(safe-area-inset-bottom));left:8px;right:8px;text-align:center;color:#d3dfed;font-size:12px;text-shadow:0 1px 4px #000;background:#142238aa;border-radius:9px;padding:6px;pointer-events:none}
#minimap{position:absolute;z-index:3;right:10px;top:58px;width:clamp(104px,27vw,150px);height:auto;aspect-ratio:1;border:2px solid #c5d5e9;border-radius:12px;background:#0b1422dd;box-shadow:0 3px 14px #0009;pointer-events:none}
</style>
</head>
<body><main class="app">
<div class="hud"><div class="stats"><div class="pill">Территория <b id="score">0%</b></div><div class="pill">Рекорд <b id="best">0%</b></div></div><button id="restart">Заново</button></div>
<canvas id="game" width="960" height="960" aria-label="Игровое поле"></canvas>
<canvas id="minimap" width="240" height="240" aria-label="Полная карта арены"></canvas>
<div id="message">Проводи пальцем в сторону движения. Полная карта — в углу.</div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap'),miniCtx=mini.getContext('2d');
let VIEW_W=960,VIEW_H=960,cameraX=0,cameraY=0,cameraReady=false,terrainDirty=true;
function resizeView(){const h=window.innerHeight;VIEW_H=960;VIEW_W=Math.max(320,Math.round(window.innerWidth/h*VIEW_H));canvas.width=VIEW_W;canvas.height=VIEW_H;}
window.addEventListener('resize',resizeView);resizeView();
const SCALE=3,W=960*SCALE,C=240,S=W/C,CX=W/2,CY=W/2,R=458*SCALE,EMPTY=0,OUT=255;
const COLORS={1:'#2ed28f',2:'#ff5874',3:'#ffc04d',4:'#a78bfa'};
const names={1:'Ты',2:'Красный',3:'Жёлтый',4:'Фиолетовый'};
const mapCanvas=document.createElement('canvas');mapCanvas.width=C;mapCanvas.height=C;
const mctx=mapCanvas.getContext('2d',{willReadFrequently:true});
const terrainCanvas=document.createElement('canvas');terrainCanvas.width=W;terrainCanvas.height=W;
const tctx=terrainCanvas.getContext('2d');
let land,players,player,frame=0,initialTerrain=true,best=Number(localStorage.getItem('territoryBest')||0),touchActive=false,touchPointer=null,touchLast=null,keys={};
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('message');
bestEl.textContent=best+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function valid(x,y){return x>=0&&y>=0&&x<C&&y<C&&Math.hypot((x+.5)*S-CX,(y+.5)*S-CY)<=R;}
function cellAt(x,y){const gx=Math.floor(x/S),gy=Math.floor(y/S);return gx>=0&&gy>=0&&gx<C&&gy<C?gy*C+gx:-1;}
function ownerAt(x,y){const i=cellAt(x,y);return i<0?OUT:land[i];}
function setCell(x,y,id){if(x>=0&&y>=0&&x<C&&y<C&&valid(x,y))land[y*C+x]=id;}
function stamp(id,points,radius=2.8){
 const rr=Math.ceil(radius);
 for(const p of points){const gx=Math.floor(p.x/S),gy=Math.floor(p.y/S);
  for(let oy=-rr;oy<=rr;oy++)for(let ox=-rr;ox<=rr;ox++)if(ox*ox+oy*oy<=radius*radius)setCell(gx+ox,gy+oy,id);
 }
}
function seedBase(id,x,y,r){
 const pts=[];for(let a=0;a<Math.PI*2;a+=.055)pts.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r});
 for(let yy=Math.floor((y-r)/S);yy<=Math.ceil((y+r)/S);yy++)for(let xx=Math.floor((x-r)/S);xx<=Math.ceil((x+r)/S);xx++){
  if(Math.hypot((xx+.5)*S-x,(yy+.5)*S-y)<=r)setCell(xx,yy,id);
 }
}
function countOwned(id){let n=0;for(let i=0;i<land.length;i++)if(land[i]===id)n++;return n;}
function updateScore(){
 const validCount=land.reduce((n,v)=>n+(v!==OUT),0),mine=countOwned(1),pct=Math.round(mine/validCount*100);
 scoreEl.textContent=pct+'%';if(pct>best){best=pct;bestEl.textContent=best+'%';localStorage.setItem('territoryBest',best);}
}
function nearestLand(id,x,y){
 let bestPoint=null,bestD=Infinity;
 const gx=Math.floor(x/S),gy=Math.floor(y/S),max=70;
 for(let rad=0;rad<=max;rad+=3){
  for(let yy=Math.max(0,gy-rad);yy<=Math.min(C-1,gy+rad);yy+=Math.max(1,Math.floor(rad/8))){
   for(let xx=Math.max(0,gx-rad);xx<=Math.min(C-1,gx+rad);xx+=Math.max(1,Math.floor(rad/8))){
    if(land[yy*C+xx]===id){const px=(xx+.5)*S,py=(yy+.5)*S,d=(px-x)**2+(py-y)**2;if(d<bestD){bestD=d;bestPoint={x:px,y:py};}}
   }
  }
  if(bestPoint&&bestD<(rad*S+S)**2)break;
 }
 return bestPoint;
}
function capture(id,path){
 initialTerrain=false;
 stamp(id,path,2.7);
 // Flood the cells connected to the circular arena's outside through non-owned land.
 const seen=new Uint8Array(C*C),queue=new Int32Array(C*C);let head=0,tail=0;
 for(let y=0;y<C;y++)for(let x=0;x<C;x++){
  const i=y*C+x;if(land[i]===OUT)continue;
  let edge=false;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(!valid(x+dx,y+dy)){edge=true;break;}
  if(edge&&land[i]!==id&&!seen[i]){seen[i]=1;queue[tail++]=i;}
 }
 while(head<tail){
  const i=queue[head++],x=i%C,y=(i/C)|0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=C||ny>=C)continue;
   const ni=ny*C+nx;if(!seen[ni]&&land[ni]!==OUT&&land[ni]!==id){seen[ni]=1;queue[tail++]=ni;}
  }
 }
 for(let i=0;i<land.length;i++)if(land[i]!==OUT&&land[i]!==id&&!seen[i])land[i]=id;
 updateScore();terrainDirty=true;
}
function makePlayer(id,x,y,angle,isHuman=false){
 return{id,x,y,angle,speed:(isHuman?130:95)*SCALE,trail:[],outside:false,turn:0,think:.25+Math.random()*.5,targetAngle:angle,isHuman,alive:true,homeTarget:null};
}
function reset(){
 land=new Uint8Array(C*C);land.fill(OUT);
 for(let y=0;y<C;y++)for(let x=0;x<C;x++)if(valid(x,y))land[y*C+x]=EMPTY;
 seedBase(1,390*SCALE,480*SCALE,68*SCALE);
 seedBase(2,690*SCALE,285*SCALE,57*SCALE);seedBase(3,690*SCALE,680*SCALE,57*SCALE);seedBase(4,270*SCALE,700*SCALE,57*SCALE);
 player=makePlayer(1,455*SCALE,480*SCALE,0,true);
 players=[player,makePlayer(2,690*SCALE,285*SCALE,2.5),makePlayer(3,690*SCALE,680*SCALE,-2),makePlayer(4,270*SCALE,700*SCALE,-.2)];
 frame=0;initialTerrain=true;cameraX=player.x-VIEW_W/2;cameraY=player.y-VIEW_H/2;cameraReady=true;terrainDirty=true;updateScore();msg.textContent='Поле увеличено в 3 раза. Камера плавно следует за тобой.';draw();
}
function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a));}
function steer(p,dt){
 if(p.isHuman){
  if(!touchActive){
   let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
   if(dx||dy)p.targetAngle=Math.atan2(dy,dx);
  }
 }else{
  // Think in short intervals instead of searching the whole nearby map every frame.
  p.think-=dt;
  if(p.think<=0){
   if(p.outside||p.trail.length>18){
    p.homeTarget=nearestLand(p.id,p.x,p.y);
    if(p.homeTarget)p.targetAngle=Math.atan2(p.homeTarget.y-p.y,p.homeTarget.x-p.x);
    p.think=.28;
   }else{
    p.targetAngle+=((Math.random()-.5)*1.25);
    p.think=.65+Math.random()*.55;
   }
  }else if(p.outside&&p.homeTarget&&p.trail.length>18){
   const d=Math.atan2(p.homeTarget.y-p.y,p.homeTarget.x-p.x);
   p.targetAngle+=clamp(angleDiff(p.targetAngle,d),-dt*1.2,dt*1.2);
  }
 }
 const diff=angleDiff(p.angle,p.targetAngle),turnRate=p.isHuman?4.2:1.9;
 p.angle+=clamp(diff,-turnRate*dt,turnRate*dt);
}
function sampleSegment(a,b,spacing=3){
 const d=dist(a,b),n=Math.max(1,Math.ceil(d/spacing)),out=[];
 for(let i=1;i<=n;i++){const t=i/n;out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}
 return out;
}
function kill(p,reason,killer=null){
 if(!p.alive)return;
 // Preserve the exposed trail before clearing it: the victor inherits both
 // the defeated player's owned cells and the complete vulnerable trail.
 const defeatedTrail=p.trail.slice();
 p.alive=false;
 p.trail=[];p.outside=false;p.homeTarget=null;
 if(killer&&killer.alive&&killer!==p){
  for(let i=0;i<land.length;i++)if(land[i]===p.id)land[i]=killer.id;
  if(defeatedTrail.length)stamp(killer.id,defeatedTrail,2.9);
  if(killer.isHuman)msg.textContent='Соперник побеждён! Его территория и след теперь твои.';
  else if(p.isHuman)msg.textContent='Ты выбыл из игры. Соперник забрал твою территорию и след.';
  else msg.textContent=(names[killer.id]||'Соперник')+' забрал территорию и след '+(names[p.id]||'проигравшего')+'.';
 }else if(!p.isHuman){
  for(let i=0;i<land.length;i++)if(land[i]===p.id)land[i]=EMPTY;
 }
 updateScore();
 terrainDirty=true;
 if(p.isHuman){
  touchActive=false;touchPointer=null;touchLast=null;
  if(!killer)msg.textContent=reason||'Ты выбыл из игры! Нажми «Заново», чтобы сыграть ещё раз.';
 }else if(!killer){
  msg.textContent=(names[p.id]||'Соперник')+' выбыл из игры!';
 }
}
function checkTrailHit(mover,from,to){
 // A head touching another player's exposed trail eliminates its owner.
 for(const other of players){
  if(other===mover||!other.trail.length)continue;
  for(let i=0;i<other.trail.length;i+=2){
   if(dist(to,other.trail[i])<27){
    kill(other,other.isHuman?'Твой след пересекли!':'',mover);
    return true;
   }
  }
 }
 // Crossing your own exposed trail is allowed in this version.
 return false;
}
function moveOne(p,dt){
 if(!p.alive)return;
 steer(p,dt);
 const from={x:p.x,y:p.y};let to={x:p.x+Math.cos(p.angle)*p.speed*dt,y:p.y+Math.sin(p.angle)*p.speed*dt};
 const radial=Math.hypot(to.x-CX,to.y-CY);
 if(radial>R-9){
  // Project the attempted move onto the inner edge, then process it normally
  // so the player's trail is still recorded while sliding along the boundary.
  const nx=(to.x-CX)/radial,ny=(to.y-CY)/radial;
  const vx=Math.cos(p.angle),vy=Math.sin(p.angle),outward=vx*nx+vy*ny;
  const tx=vx-outward*nx,ty=vy-outward*ny;
  to.x=CX+nx*(R-9);to.y=CY+ny*(R-9);
  if(Math.hypot(tx,ty)>0.001){
   p.angle=Math.atan2(ty,tx);
   p.targetAngle=p.angle;
  }
 }
 for(const other of players)if(other!==p&&dist(to,other)<39){if(other.trail.length)kill(other,other.isHuman?'Твой след пересекли!':'',p);}
 if(checkTrailHit(p,from,to))return;
 p.x=to.x;p.y=to.y;
 const own=ownerAt(p.x,p.y)===p.id;
 if(!own){
  p.outside=true;
  const samples=sampleSegment(from,to,3.6);
  p.trail.push(...samples);
  if(p.trail.length>500){kill(p,p.isHuman?'Слишком длинный след — вернись на свою территорию!':'');return;}
 }else if(p.outside&&p.trail.length){
  const closing=sampleSegment(from,to,3.6);p.trail.push(...closing);
  capture(p.id,p.trail);p.trail=[];p.outside=false;
  if(p.isHuman)msg.textContent='Отлично! Территория захвачена.';
 }
}
function draw(){
 const targetX=player.x-VIEW_W/2,targetY=player.y-VIEW_H/2;
 if(!cameraReady){cameraX=targetX;cameraY=targetY;cameraReady=true;}
 const smoothing=1-Math.exp(-13*Math.min(performanceNowDelta/1000,0.05));
 cameraX+=(targetX-cameraX)*smoothing;cameraY+=(targetY-cameraY)*smoothing;
 cameraX=clamp(cameraX,0,Math.max(0,W-VIEW_W));cameraY=clamp(cameraY,0,Math.max(0,W-VIEW_H));
 ctx.clearRect(0,0,VIEW_W,VIEW_H);ctx.fillStyle='#0b1422';ctx.fillRect(0,0,VIEW_W,VIEW_H);
 ctx.save();ctx.translate(-cameraX,-cameraY);
 ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle='#142238';ctx.fill();ctx.clip();
 if(terrainDirty){
  const img=mctx.createImageData(C,C),d=img.data;
  for(let i=0;i<land.length;i++){const id=land[i],col=id===OUT?[12,20,34]:id===EMPTY?[23,39,60]:hex(COLORS[id]);const k=i*4;d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=255;}
  mctx.putImageData(img,0,0);
  // Extract the territory outline from the cell map, then smooth the
  // polygon itself with corner-cutting. Rendering only the smoothed shape
  // removes the original staircase instead of merely drawing a soft line on it.
  tctx.clearRect(0,0,W,W);
  tctx.fillStyle='#0c1422';tctx.fillRect(0,0,W,W);
  // Build smooth contours with marching squares. Unlike tracing cell edges,
  // this interpolates the boundary halfway between ownership samples and
  // handles diagonal contacts without following staircase-shaped grid edges.
  if(!initialTerrain){
  for(let id=1;id<=4;id++){
   const segments=[];
   const owns=(x,y)=>x>=0&&y>=0&&x<C&&y<C&&land[y*C+x]===id;
   const point=(edge,x,y)=>{
    if(edge===0)return [(x+1)*S,(y+.5)*S];       // top
    if(edge===1)return [(x+1.5)*S,(y+1)*S];     // right
    if(edge===2)return [(x+1)*S,(y+1.5)*S];    // bottom
    return [(x+.5)*S,(y+1)*S];                  // left
   };
   const pairs={
    1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],
    6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[2,0]],
    11:[[2,1]],12:[[1,3]],13:[[1,0]],14:[[0,3]]
   };
   for(let y=-1;y<C;y++)for(let x=-1;x<C;x++){
    const tl=owns(x,y),tr=owns(x+1,y),br=owns(x+1,y+1),bl=owns(x,y+1);
    const code=(tl?1:0)|(tr?2:0)|(br?4:0)|(bl?8:0);
    if(code===0||code===15)continue;
    let links=pairs[code];
    if(code===5)links=[[0,1],[2,3]];
    else if(code===10)links=[[3,0],[1,2]];
    for(const pair of links){
     const a=point(pair[0],x,y),b=point(pair[1],x,y);
     segments.push({a,b,used:false});
    }
   }
   const key=p=>Math.round(p[0]*2)+','+Math.round(p[1]*2),starts=new Map();
   for(let i=0;i<segments.length;i++){
    const k=key(segments[i].a);if(!starts.has(k))starts.set(k,[]);starts.get(k).push(i);
   }
   tctx.save();tctx.fillStyle=COLORS[id];tctx.strokeStyle=COLORS[id];
   tctx.lineWidth=4;tctx.lineJoin='round';tctx.lineCap='round';tctx.beginPath();
   for(let seed=0;seed<segments.length;seed++){
    if(segments[seed].used)continue;
    const chain=[];let ei=seed,guard=0;
    while(ei!==undefined&&!segments[ei].used&&guard++<segments.length+2){
     const seg=segments[ei];seg.used=true;
     if(!chain.length)chain.push(seg.a);chain.push(seg.b);
     const choices=starts.get(key(seg.b))||[];
     ei=choices.find(j=>!segments[j].used);
    }
    if(chain.length<4)continue;
    // Two corner-cutting passes soften residual bends so the filled land
    // has the same rounded visual language as the player's thick trail.
    let rounded=chain.slice(0,-1);
    for(let pass=0;pass<2;pass++){
     const next=[];
     for(let j=0;j<rounded.length;j++){
      const p=rounded[j],q=rounded[(j+1)%rounded.length];
      next.push([p[0]*.75+q[0]*.25,p[1]*.75+q[1]*.25]);
      next.push([p[0]*.25+q[0]*.75,p[1]*.25+q[1]*.75]);
     }
     rounded=next;
    }
    chain.splice(0,chain.length,...rounded,rounded[0]);
    const first=chain[0],last=chain[chain.length-1];
    if(key(first)!==key(last))continue;
    tctx.moveTo((first[0]+last[0])/2,(first[1]+last[1])/2);
    for(let j=0;j<chain.length-1;j++){
     const a=chain[j],b=chain[j+1];
     tctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);
    }
    tctx.closePath();
   }
   tctx.fill('evenodd');tctx.stroke();tctx.restore();
  }
  }
  // The four starting bases are true vector circles, not circles approximated
  // by the ownership grid. Keep them visible until the first territory capture.
  if(initialTerrain){
   const bases=[
    {id:1,x:390*SCALE,y:480*SCALE,r:68*SCALE},
    {id:2,x:690*SCALE,y:285*SCALE,r:57*SCALE},
    {id:3,x:690*SCALE,y:680*SCALE,r:57*SCALE},
    {id:4,x:270*SCALE,y:700*SCALE,r:57*SCALE}
   ];
   for(const b of bases){
    const owner=players.find(p=>p.id===b.id);
    if(!owner||!owner.alive)continue;
    tctx.beginPath();tctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    tctx.fillStyle=COLORS[b.id];tctx.fill();
   }
  }
  terrainDirty=false;
 }
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 ctx.drawImage(terrainCanvas,0,0);
 if(initialTerrain){
  const bases=[
   {id:1,x:390*SCALE,y:480*SCALE,r:68*SCALE},
   {id:2,x:690*SCALE,y:285*SCALE,r:57*SCALE},
   {id:3,x:690*SCALE,y:680*SCALE,r:57*SCALE},
   {id:4,x:270*SCALE,y:700*SCALE,r:57*SCALE}
  ];
  for(const b of bases){
   const owner=players.find(p=>p.id===b.id);
   if(!owner||!owner.alive)continue;
   ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,Math.PI*2);
   ctx.fillStyle='#142238';ctx.fill();
   ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
   ctx.fillStyle=COLORS[b.id];ctx.fill();
  }
 }
 ctx.strokeStyle='#ffffff0b';ctx.lineWidth=3;
 for(let r=210;r<R;r+=210){ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke();}
 for(const p of players){
  if(p.alive&&p.trail.length>1){ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);for(let i=1;i<p.trail.length;i++)ctx.lineTo(p.trail[i].x,p.trail[i].y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=COLORS[p.id];ctx.lineWidth=36;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
 }
 for(const p of players){
  if(!p.alive)continue;
  ctx.beginPath();ctx.arc(p.x,p.y,p.isHuman?33:30,0,Math.PI*2);ctx.fillStyle=COLORS[p.id];ctx.fill();ctx.lineWidth=9;ctx.strokeStyle='#f4f7ff';ctx.stroke();
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(p.angle)*51,p.y+Math.sin(p.angle)*51);ctx.strokeStyle='#102033';ctx.lineWidth=9;ctx.stroke();
 }
 ctx.restore();
 miniCtx.clearRect(0,0,240,240);miniCtx.fillStyle='#0b1422';miniCtx.fillRect(0,0,240,240);
 miniCtx.imageSmoothingEnabled=true;miniCtx.imageSmoothingQuality='high';miniCtx.drawImage(terrainCanvas,0,0,240,240);
 miniCtx.beginPath();miniCtx.arc(120,120,R/W*240,0,Math.PI*2);miniCtx.strokeStyle='#d8e5f5';miniCtx.lineWidth=2;miniCtx.stroke();
 for(const p of players){if(!p.alive)continue;miniCtx.beginPath();miniCtx.arc(p.x/W*240,p.y/W*240,p.isHuman?4:3,0,Math.PI*2);miniCtx.fillStyle=COLORS[p.id];miniCtx.fill();miniCtx.strokeStyle='#fff';miniCtx.lineWidth=1;miniCtx.stroke();}
 const rx=cameraX/W*240,ry=cameraY/W*240,rw=VIEW_W/W*240,rh=VIEW_H/W*240;
 miniCtx.strokeStyle='#ffffff';miniCtx.lineWidth=1.5;miniCtx.strokeRect(rx,ry,rw,rh);
}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
let last=0,performanceNowDelta=16.67;
function loop(now){
 const dt=Math.min((now-last)/1000||0,0.035);
 performanceNowDelta=now-last||16.67;last=now;
 for(const p of players)moveOne(p,dt);
 draw();requestAnimationFrame(loop);
}
function steerByFingerMovement(e){
 const rect=canvas.getBoundingClientRect();
 const x=e.clientX-rect.left,y=e.clientY-rect.top;
 if(touchLast){
  const dx=x-touchLast.x,dy=y-touchLast.y;
  // Direction comes from the finger's movement, not its position on the arena.
  if(Math.hypot(dx,dy)>2.5)player.targetAngle=Math.atan2(dy,dx);
 }
 touchLast={x,y};
}
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 touchActive=true;touchPointer=e.pointerId;
 const rect=canvas.getBoundingClientRect();
 touchLast={x:e.clientX-rect.left,y:e.clientY-rect.top};
 canvas.setPointerCapture(e.pointerId);e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
 if(touchActive&&e.pointerId===touchPointer){steerByFingerMovement(e);e.preventDefault();}
});
function endTouch(e){if(e.pointerId!==touchPointer)return;touchActive=false;touchPointer=null;touchLast=null;}
canvas.addEventListener('pointerup',endTouch);
canvas.addEventListener('pointercancel',endTouch);
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys[e.key]=true;e.preventDefault();}});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
document.getElementById('restart').addEventListener('click',reset);
reset();requestAnimationFrame(loop);
})();
</script>
